openapi: 3.0.3
info:
  title: Lovebyte API
  version: 0.1.0
paths:
  /v1/auth/otp:
    post:
      summary: Send a one-time code
      responses:
        '201':
          description: Code stored and logged when OTP_LOG_CODE=true
  /v1/auth/sessions:
    post:
      summary: Exchange a code for a session
      responses:
        '201':
          description: Access token, refresh token, and user
    delete:
      summary: Revoke the current session
      responses:
        '200':
          description: Session revoked
  /v1/auth/sessions/refresh:
    post:
      summary: Rotate a refresh token
      responses:
        '201':
          description: New token pair
  /v1/invites:
    post:
      summary: Create a one-time pair invite
      responses:
        '201':
          description: Invite code
        '409':
          description: Caller already has an active partnership
  /v1/invites/{code}/accept:
    post:
      summary: Accept an invite and open the partnership
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Partnership
        '409':
          description: One of the two people is already paired
        '410':
          description: Invite expired or used
  /v1/partnership:
    get:
      summary: Read the caller's active partnership
      responses:
        '200':
          description: Partnership
        '404':
          description: Caller is not paired
    patch:
      summary: Set the day the partnership started
      responses:
        '200':
          description: Partnership with daysTogether
  /v1/notes:
    get:
      summary: List notes in the partnership
      responses:
        '200':
          description: Notes
    post:
      summary: Create a note
      responses:
        '201':
          description: Note
  /v1/notes/{id}:
    patch:
      summary: Edit a note
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Note
  /v1/events:
    get:
      summary: List events with countdownDays
      responses:
        '200':
          description: Events
    post:
      summary: Create an event and send a due reminder to the partner
      responses:
        '201':
          description: Event
  /v1/partnerships/{id}/leave:
    post:
      summary: Close the partnership for both members
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Partnership closed
        '403':
          description: Caller is not an active member
  /v1/media/uploads:
    post:
      summary: Reserve an image and return a signed PUT URL
      responses:
        '201':
          description: Upload URL
  /v1/media/{id}/content:
    put:
      summary: Store image bytes with the signed URL
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stored
    get:
      summary: Read image bytes with a signed URL
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image bytes
        '404':
          description: Deleted or missing
  /v1/media/{id}:
    delete:
      summary: Delete an image and invalidate signed URLs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /v1/albums:
    get:
      summary: List albums in the partnership
      responses:
        '200':
          description: Albums
    post:
      summary: Create an album
      responses:
        '201':
          description: Album
  /v1/albums/{id}/items:
    post:
      summary: Add an uploaded image to an album
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Album item
  /v1/story-entries:
    get:
      summary: List story milestones for the caller's partnership
      responses:
        '200':
          description: Story entries
    post:
      summary: Add a note or image milestone
      responses:
        '201':
          description: Story entry
