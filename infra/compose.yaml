services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lovebyte
      POSTGRES_PASSWORD: lovebyte
      POSTGRES_DB: lovebyte
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lovebyte -d lovebyte"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
